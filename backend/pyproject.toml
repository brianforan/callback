[project]
name = "callback-api"
version = "0.1.0"
description = "API for tracking job applications and the resumes behind them"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14,<2",
    "argon2-cffi>=23.1,<26",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "psycopg[binary]>=3.2.3,<4",
    "pydantic-settings>=2.6,<3",
    "pyjwt>=2.9,<3",
    # Reads uploaded resume PDFs. Apache-2.0/BSD-3, unlike PyMuPDF's AGPL.
    "pypdfium2>=4.30,<5",
    # Indeed's search. Pinned to a minor version, since a scraper changes when Indeed does.
    "python-jobspy>=1.4.1,<1.5",
    "python-multipart>=0.0.18,<1",
    "sqlalchemy>=2.0.36,<2.1",
    "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.7,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "app",
    "app.billing",
    "app.companies",
    "app.listings",
    "app.postings",
    "app.research",
    "app.resumes",
    "app.routers",
    "app.scout",
    "app.tailoring",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

server {
    listen 8080;
    server_name _;

    # Caddy on the host terminates TLS and is the only client: the port is published on 127.0.0.1,
    # so its connections arrive from the Docker network's gateway. Without this, every visitor
    # would share one login and API rate limit. Caddy ignores any X-Forwarded-For a visitor sends
    # and writes the visitor's address, and nginx takes the last address in it.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;

    include /etc/nginx/snippets/app.conf;
}

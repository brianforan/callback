root /usr/share/nginx/html;
index index.html;
# Room for the API's own 2 MiB PDF limit plus the multipart framing around it. The API checks the
# file itself and says why when one is too large.
client_max_body_size 3m;

# Docker's DNS, resolved per request so the API container can restart without reloading nginx.
resolver 127.0.0.11 valid=10s;
set $api_upstream http://api:8000;

include /etc/nginx/snippets/security-headers.conf;

location = /api/auth/login {
    limit_req zone=login burst=5 nodelay;
    limit_req_status 429;
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass $api_upstream;
}

location = /api/auth/register {
    limit_req zone=login burst=5 nodelay;
    limit_req_status 429;
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass $api_upstream;
}

location /api/ {
    limit_req zone=api burst=40 nodelay;
    limit_req_status 429;
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass $api_upstream;
}

location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
}
